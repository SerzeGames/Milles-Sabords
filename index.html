/* ------------------------------ OUTILS ---------------------------------- */
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
let W=0, H=0, DPR=1, PORTRAIT=false;
const rnd  = n => Math.random()*n;
const ri   = n => Math.floor(Math.random()*n);
const clamp= (v,a,b)=> v<a?a:(v>b?b:v);
const lerp = (a,b,t)=> a+(b-a)*t;
const now  = ()=> performance.now()/1000;

function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function text(s,x,y,size,{col=C.bone,font=UI,w="600",al="left",bl="middle",sh=0,ls=0}={}){
  ctx.font = w+" "+size+"px "+font;
  ctx.textAlign = ls?"left":al; ctx.textBaseline = bl;
  if(ls){ // rendu lettre par lettre pour l'interlettrage
    let tot=0; for(const ch of s) tot+=ctx.measureText(ch).width+ls;
    tot-=ls; let cx = al==="center"? x-tot/2 : al==="right"? x-tot : x;
    for(const ch of s){
      if(sh){ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillText(ch,cx+sh,y+sh);}
      ctx.fillStyle=col; ctx.fillText(ch,cx,y); cx+=ctx.measureText(ch).width+ls;
    }
    return;
  }
  if(sh){ ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillText(s,x+sh,y+sh); }
  ctx.fillStyle=col; ctx.fillText(s,x,y);
}
function wrap(s,size,maxw,font=UI,w="500"){
  ctx.font = w+" "+size+"px "+font;
  const out=[]; let line="";
  for(const word of s.split(" ")){
    const t = line?line+" "+word:word;
    if(ctx.measureText(t).width>maxw && line){ out.push(line); line=word; } else line=t;
  }
  if(line) out.push(line);
  return out;
}
function paraph(x,y,w,h,r=10){ // panneau parchemin
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.35)"; rr(x+3,y+4,w,h,r); ctx.fill();
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,C.parch); g.addColorStop(1,C.parch2);
  ctx.fillStyle=g; rr(x,y,w,h,r); ctx.fill();
  ctx.strokeStyle="rgba(60,40,15,.35)"; ctx.lineWidth=1.5; ctx.stroke();
  ctx.restore();
}
function rope(x,y,w,h,r=14,col=C.brass,alpha=.75){ // liseré façon cordage
  ctx.save(); ctx.globalAlpha=alpha; ctx.lineWidth=3; ctx.lineCap="round";
  ctx.strokeStyle=col; ctx.setLineDash([11,9]); ctx.lineDashOffset=0;
  rr(x,y,w,h,r); ctx.stroke();
  ctx.strokeStyle="rgba(0,0,0,.35)"; ctx.lineDashOffset=10;
  rr(x,y,w,h,r); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
}
/* Fond local sous les textes quand la vidéo tourne, pour garder du contraste */
function scrim(r,a){
  if(!fondAnime()||!r) return;
  ctx.save(); ctx.fillStyle="rgba(4,14,22,"+a+")";
  rr(r.x-6,r.y-6,r.w+12,r.h+12,14); ctx.fill(); ctx.restore();
}
function zone(x,y,w,h,label,tint){
  ctx.save();
  ctx.fillStyle=tint||"rgba(6,20,30,.45)"; rr(x,y,w,h,14); ctx.fill();
  ctx.strokeStyle="rgba(217,164,65,.22)"; ctx.lineWidth=1.5; ctx.stroke();
  if(label) text(label.toUpperCase(), x+12, y+13, Math.max(9,S.u*0.62), {col:"rgba(234,215,173,.5)",w:"700",ls:1.6});
  ctx.restore();
}

/* Audio minimal (aucun fichier son requis) */
const AC = window.AudioContext||window.webkitAudioContext;
let ac=null, muted=false;
function beep(freq,dur,type="triangle",vol=.05,slide=0){
  if(muted) return;
  try{
    if(!ac) ac=new AC();
    if(ac.state==="suspended") ac.resume();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.value=freq;
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), ac.currentTime+dur);
    g.gain.value=vol; g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur+.02);
  }catch(e){}
}
const SFX = {
  roll:()=>{ for(let i=0;i<5;i++) setTimeout(()=>beep(180+rnd(260),.06,"square",.035),i*45); },
  skull:()=>beep(150,.35,"sawtooth",.05,-90),
  good:()=>{ beep(520,.12,"triangle",.05); setTimeout(()=>beep(780,.16,"triangle",.05),110); },
  bank:()=>{ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.14,"triangle",.045),i*80)); },
  card:()=>beep(320,.1,"sine",.04,180),
  click:()=>beep(420,.05,"square",.03)
};

/* ------------------------------ VIDÉO ----------------------------------- */
let VIDEO_ON = true, videoPrete = false;
const bgv = document.getElementById("bgv");

  window.addEventListener("pointerdown", lireVideo, {once:true});
  document.addEventListener("visibilitychange", ()=>{ document.hidden ? bgv.pause() : lireVideo(); });
}
function lireVideo(){
  if(!bgv || !VIDEO_ON || !VIDEO_FOND) return;
  const p = bgv.play(); if(p && p.catch) p.catch(()=>{});
}
function basculeVideo(){
  VIDEO_ON = !VIDEO_ON;
  if(!bgv) return;
  bgv.style.display = VIDEO_ON ? "" : "none";
  if(VIDEO_ON) lireVideo(); else bgv.pause();
}
const fondAnime = ()=> VIDEO_ON && videoPrete;

/* ------------------------------ ASSETS ---------------------------------- */
const IMG={}; let loaded=0;
function loadAll(cb){
  const keys=Object.keys(SRC);
  keys.forEach(k=>{
    const im=new Image();
    im.onload = ()=>{ if(++loaded===keys.length) cb(); };
    im.onerror= ()=>{ IMG[k]=null; if(++loaded===keys.length) cb(); };
    im.src=SRC[k]; IMG[k]=im;
  });
}
function drawCard(i,x,y,w,h,r){ // carte Pirate n°i, dessinée dans le rect donné
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.5)"; rr(x+3,y+5,w,h,r); ctx.fill();
  rr(x,y,w,h,r); ctx.clip();
  ctx.fillStyle="#0e0b06"; ctx.fillRect(x,y,w,h);
  if(IMG.sheet && IMG.sheet.width) ctx.drawImage(IMG.sheet, CARD_X[i],CARD_SY,CARD_SW,CARD_SH, x,y,w,h);
  ctx.restore();
  ctx.save(); ctx.strokeStyle="rgba(217,164,65,.55)"; ctx.lineWidth=2; rr(x,y,w,h,r); ctx.stroke(); ctx.restore();
}
function drawBack(x,y,w,h,r){
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.5)"; rr(x+3,y+5,w,h,r); ctx.fill();
  rr(x,y,w,h,r); ctx.clip();
  ctx.fillStyle="#c9b184"; ctx.fillRect(x,y,w,h);
  if(IMG.back && IMG.back.width) ctx.drawImage(IMG.back, BACK_S.x,BACK_S.y,BACK_S.w,BACK_S.h, x,y,w,h);
  ctx.restore();
  ctx.save(); ctx.strokeStyle="rgba(217,164,65,.45)"; ctx.lineWidth=2; rr(x,y,w,h,r); ctx.stroke(); ctx.restore();
}
function drawFace(f,cx,cy,s){
  if(IMG.dice && IMG.dice.width) ctx.drawImage(IMG.dice, f*DIE_S,0,DIE_S,DIE_S, cx-s/2,cy-s/2,s,s);
  else { ctx.fillStyle="#eee"; rr(cx-s/2,cy-s/2,s,s,s*.18); ctx.fill(); }
}

/* ============================== RÉSEAU ==================================== */
/* Modèle hôte-autoritaire : l'hôte fait tourner toute la logique (dés, cartes,
   IA, score) et diffuse l'état complet ; les invités affichent cet état et
   n'envoient que des intentions (« relance ces dés », « encaisse », …).       */
const NET = {
  role:"local",            // local | host | guest
  peer:null, id:null,
  conns:[],                // hôte : connexions vers les invités
  host:null,               // invité : connexion vers l'hôte
  seat:0,                  // siège de CE client dans S.players
  name:"",                 // pseudo choisi
  status:"", room:"",
  lastSent:0, dirty:false,
  matchTimer:0, tries:0
};
const ROOM_PREFIX = "millesabords-v1-";   // espace de noms PeerJS partagé
const MAX_PLAYERS = 4;

function online(){ return NET.role!=="local"; }
function isHost(){ return NET.role==="host"; }
function myTurn(){ return online() ? S.cur===NET.seat : true; }

function randRoom(){ return ROOM_PREFIX+Math.random().toString(36).slice(2,7); }
function netSay(t){ NET.status=t; }

/* --- démarrage d'une recherche de partie rapide --- */
function quickPlay(name){
  NET.sid = NET.sid || (Date.now().toString(36)+Math.random().toString(36).slice(2,8));
  NET.name=name||("Corsaire"+(1+ri(999)));
  NET.role="guest"; NET.status="Recherche d'une partie…"; NET.tries=0;
  NET.searching=true; NET.established=false;   // on cherche encore un rôle
  S.phase="lobby";
  tryJoin();
}
function tryJoin(){
  NET.tries++;
  connectFlow();
}
/* Vrai une fois qu'on a un rôle définitif (hôte lancé OU invité connecté) :
   à partir de là, plus AUCUNE recherche ne doit être relancée. */
function lockRole(){ NET.searching=false; NET.established=true; }
/* Relance de recherche autorisée seulement si on cherche encore. */
function retrySearch(delay){
  setTimeout(()=>{ if(NET.searching && S.phase==="lobby") connectFlow(); }, delay);
}
/* Matchmaking robuste : on tente d'abord de REJOINDRE l'hôte du salon d'accueil ;
   si personne n'y répond, on tente de DEVENIR cet hôte ; en cas de collision
   (deux clients s'y essaient en même temps), le perdant re-tente de rejoindre.  */
const LOBBY_ID = ROOM_PREFIX+"lobby";
function connectFlow(){
  if(!NET.searching || S.phase!=="lobby") return;   // rôle déjà établi → on n'ouvre rien
  netSay("Recherche d'une partie…");
  // 1) tenter de rejoindre un hôte déjà présent
  const probe=new Peer(null,{debug:0});
  let done=false;
  probe.on("open",()=>{
    if(!NET.searching){ try{probe.destroy();}catch(_){}; return; }
    NET.peer=probe;
    const conn=probe.connect(LOBBY_ID,{reliable:true});
    let ouvert=false;
    const fallback=()=>{
      if(done || !NET.searching) return; done=true;
      try{ conn.close(); }catch(_){}
      try{ probe.destroy(); }catch(_){}
      NET.peer=null; claimHost();
    };
    conn.on("open",()=>{
      if(!NET.searching){ try{conn.close();}catch(_){}; try{probe.destroy();}catch(_){}; return; }
      ouvert=true; done=true; lockRole();               // invité confirmé
      NET.host=conn; conn.send({t:"name",name:NET.name,sid:NET.sid});
      netSay("Partie trouvée, connexion…");
    });
    conn.on("data",d=>guestOnData(d));
    conn.on("close",()=>{ if(ouvert) guestLost(); });
    conn.on("error",()=>{ if(!ouvert) fallback(); });   // pas d'hôte ici → devenir hôte
    setTimeout(fallback, 2500);                          // filet de sécurité
  });
  probe.on("error",()=>{ if(!done && NET.searching){ try{probe.destroy();}catch(_){}; retrySearch(300); } });
}
/* Essayer de réserver l'ID d'accueil pour devenir hôte. */
function claimHost(){
  if(!NET.searching || S.phase!=="lobby") return;
  netSay("Ouverture d'un salon…");
  const p=new Peer(LOBBY_ID,{debug:0});
  let devenu=false;
  p.on("open",()=>{
    if(!NET.searching){ try{p.destroy();}catch(_){}; return; }
    devenu=true; lockRole();                 // hôte confirmé : plus de recherche
    NET.peer=p; startHosting(p,LOBBY_ID);
  });
  p.on("error",e=>{
    if(devenu){                              // erreur APRÈS être devenu hôte : on ignore,
      return;                                // ne JAMAIS relancer une recherche (évite l'auto-connexion)
    }
    try{ p.destroy(); }catch(_){}
    NET.peer=null;
    // l'ID d'accueil est déjà pris → un autre est hôte, on re-tente de le rejoindre
    retrySearch(e.type==="unavailable-id" ? 300+ri(400) : 1000);
  });
}

/* ---- côté HÔTE ---- */
/* ---- côté HÔTE ---- */
function startHosting(peer,room){
  NET.role="host"; NET.room=room; NET.seat=0;
  S.players=[{name:NET.name, score:0, disp:0, ai:false, online:true, seat:0}];
  netSay("Salon ouvert. En attente de joueurs…");
  peer.on("connection",conn=>{
    conn.on("open",()=>{
      if(S.phase!=="lobby" || S.players.length>=MAX_PLAYERS){
        conn.send({t:"full"}); setTimeout(()=>{try{conn.close();}catch(_){}} ,300); return;
      }
      const seat=S.players.length;
      S.players.push({name:"Corsaire", score:0, disp:0, ai:false, online:true, seat, conn, pending:true});
      NET.conns.push(conn);
      conn.send({t:"welcome", seat, you:seat});
      broadcastLobby();
    });
    conn.on("data",d=>hostOnData(conn,d));
    conn.on("close",()=>hostDropConn(conn));
    conn.on("error",()=>hostDropConn(conn));
  });
}
function hostSeatOf(conn){ const p=S.players.find(x=>x.conn===conn); return p?p.seat:-1; }
function hostDropConn(conn){
  NET.conns=NET.conns.filter(c=>c!==conn);
  const p=S.players.find(x=>x.conn===conn);
  if(!p) return;
  if(S.phase==="lobby"){
    S.players=S.players.filter(x=>x!==conn && x.conn!==conn);
    S.players.forEach((q,i)=>{ q.seat=i; if(q.conn) q.conn.send({t:"welcome",seat:i,you:i}); });
    broadcastLobby();
  }else{
    // en pleine partie : le siège est repris par l'IA pour ne pas bloquer
    if(!p.ai){ p.name=p.name+" (IA)"; say(p.name+" a quitté — repris par l'ordinateur.", C.rust); }
    p.online=false; p.ai=true; p.conn=null;
    if(S.cur===p.seat && S.phase!=="over") scheduleHostAI();
    broadcastState();
  }
}
function broadcastLobby(){
  const roster=S.players.map(p=>({name:p.name, seat:p.seat, ai:!!p.ai}));
  NET.conns.forEach(c=>{ try{ c.send({t:"lobby", roster, host:0, canStart:S.players.length>=2}); }catch(_){} });
}
function broadcastState(){
  if(!isHost()) return;
  const snap=snapshot();
  NET.conns.forEach(c=>{ try{ c.send({t:"state", s:snap}); }catch(_){} });
}
function hostOnData(conn,d){
  const seat=hostSeatOf(conn);
  if(d.t==="name"){
    if(d.sid && NET.sid && d.sid===NET.sid){   // c'est notre propre session : on refuse
      const p=S.players.find(x=>x.conn===conn);
      if(p){ S.players=S.players.filter(x=>x!==p); S.players.forEach((q,i)=>q.seat=i); }
      NET.conns=NET.conns.filter(c=>c!==conn);
      try{ conn.close(); }catch(_){}
      broadcastLobby();
      return;
    }
    const p=S.players.find(x=>x.conn===conn);
    if(p){ p.name=(""+d.name).slice(0,16)||("Corsaire"+seat); p.pending=false; broadcastLobby(); }
    return;
  }
  if(d.t==="chat"){ pushChat(seat,d.m); broadcastChat(seat,d.m); return; }
  if(d.t==="intent") hostIntent(seat,d);
}
/* Toute intention d'un invité n'est exécutée que si c'est bien son tour. */
function hostIntent(seat,d){
  if(S.phase==="lobby"){
    if(d.a==="start" && seat===0){ hostStart(); }
    return;
  }
  if(seat!==S.cur) return;                 // sécurité : jamais hors de son tour
  applyIntent(d);
  broadcastState();
}
function hostStart(){
  // on complète éventuellement avec des IA jusqu'à 2 joueurs minimum ? Non :
  // la partie rapide démarre avec les humains présents (2 à 4).
  buildDeck(); S.log=[]; S.lastRound=false; S.endAt=-1;
  S.players.forEach(p=>{ p.score=0; p.disp=0; });
  S.cur=S.players.length-1;
  NET.conns.forEach(c=>{ try{ c.send({t:"begin"}); }catch(_){} });
  startTurn(); broadcastState();
}

/* ---- côté INVITÉ ---- */
function becomeAloneHost(){
  try{ if(NET.peer) NET.peer.destroy(); }catch(_){}
  NET.peer=null; NET.host=null; NET.conns=[];
  NET.searching=true;                       // on relance une recherche propre
  retrySearch(300+ri(400));
}
function guestLost(){
  if(S.phase==="over") return;
  netSay("Connexion perdue avec l'hôte.");
  NET.role="local";
  S.banner={txt:"Hôte déconnecté — partie terminée", t:S.t+4, col:C.rust};
  S.phase="menu"; S.players=[]; S.dice=[];
}
function guestOnData(d){
  switch(d.t){
    case "welcome": NET.seat=d.you; break;
    case "full": netSay("Partie complète — on cherche ailleurs…"); becomeAloneHost(); break;
    case "lobby": S.lobby=d.roster; S.canStart=false; break;   // seul l'hôte lance
    case "begin": S.phase="play"; break;
    case "state": applySnapshot(d.s); break;
    case "chat": pushChat(d.seat,d.m); break;
  }
}
function guestSend(o){ if(NET.host){ try{ NET.host.send(o); }catch(_){} } }

/* ---- envoi d'une intention (depuis n'importe quel client) ---- */
function sendIntent(o){
  if(isHost()){
    if(o.a==="start"){ if(S.phase==="lobby") hostStart(); return; }
    applyIntent(o); broadcastState();
  }
  else guestSend(Object.assign({t:"intent"},o));
}

/* ---- chat léger ---- */
function pushChat(seat,m){
  const name=(S.players[seat]&&S.players[seat].name)||(S.lobby&&S.lobby[seat]&&S.lobby[seat].name)||"?";
  say("💬 "+name+" : "+(""+m).slice(0,80), C.jade);
}
function broadcastChat(seat,m){ NET.conns.forEach(c=>{ try{ c.send({t:"chat",seat,m}); }catch(_){} }); }
function sendChat(m){
  if(isHost()){ pushChat(NET.seat,m); broadcastChat(NET.seat,m); }
  else { pushChat(NET.seat,m); guestSend({t:"chat",m}); }
}

/* ============ SÉRIALISATION DE L'ÉTAT (hôte → invités) ============ */
function snapshot(){
  return {
    phase:S.phase, cur:S.cur, card:S.card,
    flip:{mode:S.flip.mode, t:+S.flip.t.toFixed(3), dur:S.flip.dur},
    dice:S.dice.map(d=>({f:d.anim?d.anim.final:d.face, z:d.zone, v:d.virtual?1:0, s:d.sel?1:0, r:d.anim?1:0})),
    rolls:S.rolls, island:S.island?1:0, witch:S.witchUsed?1:0,
    last:S.lastRound?1:0, endAt:S.endAt,
    players:S.players.map(p=>({n:p.name, sc:p.score, ai:p.ai?1:0, on:p.online?1:0, seat:p.seat})),
    log:S.log.slice(0,14).map(e=>({m:e.m, c:e.c})),
    pop:S.pop.map(x=>({txt:x.txt, sub:x.sub||"", col:x.col, t:+(x.t-S.t).toFixed(2), life:x.life})),
    banner:S.banner?{txt:S.banner.txt, dt:+(S.banner.t-S.t).toFixed(2), col:S.banner.col}:null,
    resolveIn:+(S.resolveUntil-S.t).toFixed(2),
    winners:S.winners?S.winners.map(w=>w.seat):null,
    tSent:S.t
  };
}
function applySnapshot(s){
  const anim = S.snap;               // ancien instantané pour animer les dés
  S.phase=s.phase; S.cur=s.cur; S.card=s.card;
  // ne pas casser une animation de retournement locale déjà en cours
  if(!(S.flip.mode==="reveal"||S.flip.mode==="hide") || s.flip.mode!==S.flip.mode)
    S.flip={mode:s.flip.mode, t:s.flip.t, dur:s.flip.dur};
  S.rolls=s.rolls; S.island=!!s.island; S.witchUsed=!!s.witch;
  S.lastRound=!!s.last; S.endAt=s.endAt;
  S.players=s.players.map(p=>{
    const old=S.players.find(o=>o.seat===p.seat);
    return {name:p.n, score:p.sc, disp:old?old.disp:p.sc, ai:!!p.ai, online:!!p.on, seat:p.seat};
  });
  // dés : on conserve les positions écran pour l'interpolation, on relance les anims
  const anciens=S.dice;
  S.dice=s.dice.map((d,i)=>{
    const o=anciens[i]||{};
    // une animation ne survit que sur un dé toujours posé sur la table
    const garde = o.anim && d.z==="table" && o.zone==="table";
    const die={face:d.f, zone:d.z, virtual:!!d.v, sel:!!d.s, roll:!!d.r,
      x:o.x!==undefined?o.x:W/2, y:o.y!==undefined?o.y:H/2,
      tx:o.tx!==undefined?o.tx:W/2, ty:o.ty!==undefined?o.ty:H/2,
      size:o.size||40, rot:garde?o.rot:0, sc:garde?o.sc:1, anim:garde?o.anim:null};
    if(die.anim) die.anim.final=d.f;     // la face finale suit toujours l'hôte
    return die;
  });
  // rejouer une animation de lancer si l'hôte vient d'en déclencher une
  if(s.phase==="roll" && (!anim || anim.rolls!==s.rolls)) startGuestRollAnim();
  S.log=s.log.map(e=>({m:e.m, c:e.c}));
  S.pop=s.pop.map(x=>({txt:x.txt, sub:x.sub, col:x.col, t:S.t+x.t, life:x.life}));
  S.banner=s.banner?{txt:s.banner.txt, t:S.t+s.banner.dt, col:s.banner.col}:null;
  S.resolveUntil=S.t+s.resolveIn;
  if(s.phase==="over" && s.winners) S.winners=s.winners.map(seat=>S.players.find(p=>p.seat===seat)).filter(Boolean);
  S.snap={rolls:s.rolls, phase:s.phase};
}
/* Invité : rejoue l'animation de dés qui roulent (purement visuel) */
function startGuestRollAnim(){
  SFX.roll();
  let i=0;
  S.dice.forEach(d=>{
    // seuls les dés effectivement relancés par l'hôte tournent, et vers leur face réelle
    if(d.roll && d.zone==="table"){ d.anim={t:0,dur:.5,delay:(i++)*.045,final:d.face,flick:0}; }
  });
}

/* ============ APPLICATION D'UNE INTENTION (hôte seulement) ============ */
function applyIntent(d){
  const c=card();
  switch(d.a){
    case "first": if(S.phase==="card" && S.flip.mode===null) rollDice(realTable()); break;
    case "sel": {
      // d.k = index de dé à basculer (sélection)
      const die=S.dice[d.k];
      if(die && !die.virtual && S.phase==="choose" && !S.island &&
         (die.zone==="table" || (die.zone==="chest" && c.id==="chest"))) die.sel=!die.sel;
      break;
    }
    case "all": { const rt=realTable(), all=rt.every(x=>x.sel); rt.forEach(x=>x.sel=!all); break; }
    case "roll": {
      if(S.phase!=="choose") break;
      if(S.island){ tableDice().forEach(x=>{if(!x.virtual)x.sel=true;}); rollDice(realTable()); break; }
      const sel=rerollable().filter(x=>x.sel);
      const sortis=sel.filter(x=>x.zone==="chest");
      if(sortis.length){ sortis.forEach(x=>x.zone="table");
        say("Dés ressortis du coffre : "+sortis.length, C.parch2); }
      if(sel.length>=2) rollDice(sel);
      break;
    }
    case "chest": {
      const sel=S.dice.filter(x=>x.zone==="table"&&!x.virtual&&x.sel);
      sel.forEach(x=>{ x.zone="chest"; x.sel=false; });
      if(sel.length) say((P().name)+" met "+sel.length+" dé"+(sel.length>1?"s":"")+" au coffre.", C.parch2);
      if(stuck()) resolve();
      break;
    }
    case "witch": if(c.id==="witch" && !S.witchUsed && realSkulls().length) useWitch(); break;
    case "bank": if(S.phase==="choose"){ const sc=turnScore(); if(sc.total>0 && !sc.battleFail) resolve(); } break;
    case "skip": if(S.phase==="resolve") S.resolveUntil=Math.min(S.resolveUntil,S.t+.12); break;
  }
}

/* ------------------------------- ÉTAT ------------------------------------ */
const S = {
  phase:"menu",          // menu | rules | card | roll | choose | resolve | over
  u:14,                  // unité typographique
  players:[], cur:0, nAI:1,
  deck:[], card:0, flip:{mode:null,t:0,dur:.55}, resolveUntil:0,
  dice:[],               // {face,zone,sel,virtual,x,y,tx,ty,size,rot,sc,anim}
  rolls:0, island:false, newSkulls:0, witchUsed:false,
  lastRound:false, endAt:-1,
  log:[], pop:[], banner:null,
  aiAt:0, pendingAfterRoll:false, hover:null, t:0
};

function say(msg,col){ S.log.unshift({m:msg,c:col||C.parch}); if(S.log.length>22) S.log.pop(); }
function P(){ return S.players[S.cur]; }
function card(){ return CARDS[S.card]; }
function tableDice(){ return S.dice.filter(d=>d.zone==="table"); }
function realTable(){ return S.dice.filter(d=>d.zone==="table" && !d.virtual); }
function chestDice(){ return S.dice.filter(d=>d.zone==="chest"); }
function skullDice(){ return S.dice.filter(d=>d.zone==="skull"); }
function realSkulls(){ return S.dice.filter(d=>d.zone==="skull" && !d.virtual); }
function skulls(){ return skullDice().length; }
function rerollable(){ return S.dice.filter(d=>(d.zone==="table"||d.zone==="chest") && !d.virtual); }
function selCount(){ return rerollable().filter(d=>d.sel).length; }
function selTable(){ return S.dice.filter(d=>d.zone==="table" && !d.virtual && d.sel).length; }

function newGame(nAI){
  S.nAI = nAI;
  S.players = [{name:"Vous", score:0, disp:0, ai:false}];
  for(let i=0;i<nAI;i++) S.players.push({name:AI_NAMES[i], score:0, disp:0, ai:true});
  S.deck=[]; S.log=[]; S.lastRound=false; S.endAt=-1; S.cur=S.players.length-1;
  say("La partie commence. Premier à "+TARGET+" points déclenche le dernier tour.", C.brass);
  nextTurn();
}
function buildDeck(){
  S.deck=[];
  CARDS.forEach((c,i)=>{ for(let k=0;k<c.copies;k++) S.deck.push(i); });
  for(let i=S.deck.length-1;i>0;i--){ const j=ri(i+1); [S.deck[i],S.deck[j]]=[S.deck[j],S.deck[i]]; }
}
function nextTurn(){
  S.cur = (S.cur+1)%S.players.length;
  // le tour est revenu au joueur qui a franchi le seuil : tout le monde a joué
  if(S.lastRound && S.cur===S.endAt){ gameOver(); return; }
  startTurn();
  if(online() && isHost()) scheduleHostAI();   // siège vide repris par l'IA
}
function startTurn(){
  if(online() && !isHost()) return;      // seul l'hôte pilote le déroulé
  if(!S.deck.length) buildDeck();
  S.card = S.deck.pop();
  S.dice=[]; S.rolls=0; S.island=false; S.newSkulls=0; S.witchUsed=false;
  S.banner=null; S.aiAt=0;

  for(let i=0;i<8;i++) S.dice.push(mkDie(SABRE,"table"));
  const c = card();
  if(c.id==="skull1") addVirtual(SKULL,"skull",1);
  if(c.id==="skull2") addVirtual(SKULL,"skull",2);
  if(c.id==="diam")   addVirtual(DIAM,"table",1);
  if(c.id==="coin")   addVirtual(COIN,"table",1);

  S.phase="card"; S.flip={mode:"reveal",t:0,dur:.55}; if(!online()||isHost()) SFX.card();
  const qui = online()? P().name : (P().ai?P().name:"Vous");
  say(qui+" — carte "+c.n, P().ai?C.parch2:C.brass);
  broadcastState();
}
function mkDie(face,zone){
  return {face, zone, sel:false, virtual:false, x:W/2, y:H/2, tx:W/2, ty:H/2,
          size:40, rot:0, sc:1, anim:null, born:S.t};
}
function addVirtual(face,zone,n){
  for(let i=0;i<n;i++){ const d=mkDie(face,zone); d.virtual=true; S.dice.push(d); }
}

/* ------------------------------ LANCERS ---------------------------------- */
function rollDice(list){
  if(!list.length) return;
  S.rolls++;
  S.phase="roll"; if(!online()||isHost()) SFX.roll();
  list.forEach((d,i)=>{
    d.sel=false;
    d.anim={t:0, dur:.5+rnd(.18), delay:i*.045, final:ri(6), flick:0};
  });
  S.pendingAfterRoll=true;
  broadcastState();
}
function afterRollCore(){
  const before = skulls();
  let got=0;
  realTable().forEach(d=>{ if(d.face===SKULL){ d.zone="skull"; got++; } });
  S.newSkulls=got;
  if(got){ SFX.skull(); }
  const c=card(), sk=skulls();

  // Île de la Tête-de-Mort : 4+ crânes au premier lancer
  if(S.rolls===1 && c.id!=="storm" && sk>=ILE_MIN){
    S.island=true;
    say("Île de la Tête-de-Mort ! "+sk+" têtes de mort.", C.rust);
  }
  if(S.island){
    if(got===0 || realTable().length===0){ resolve(); return; }
    tableDice().forEach(d=>{ if(!d.virtual) d.sel=true; });
    S.phase="choose"; if(P().ai) S.aiAt=S.t+.9;
    return;
  }
  if(c.id==="storm"){
    if(S.rolls>=2 || realTable().length<2){ resolve(); return; }
    S.phase="choose";
    if(P().ai) S.aiAt=S.t+.9;
    else preselect();
    return;
  }
  if(sk>=3){
    if(c.id==="witch" && !S.witchUsed && realSkulls().length){
      S.phase="choose"; say("3 têtes de mort… la Sorcière peut encore sauver le tour.", C.rust);
      if(P().ai) S.aiAt=S.t+.8;
      return;
    }
    resolve(); return;
  }
  if(stuck()){ resolve(); return; }
  S.phase="choose";
  if(P().ai) S.aiAt=S.t+1.0;
  else preselect();
  if(before<sk && sk===2 && !P().ai) S.banner={txt:"Plus qu'une tête de mort avant le naufrage", t:S.t+2.2, col:C.rust};
}
/* Aucune relance possible et rien à encaisser : le tour s'arrête tout seul */
function stuck(){
  if(rerollable().length>=2) return false;   // on peut toujours ressortir des dés du coffre
  const sc=turnScore();
  return sc.total<=0 || sc.battleFail;
}
function afterRoll(){
  afterRollCore();
  broadcastState();        // hôte : publier l'état résultant du lancer (choose/resolve/île…)
}
function useWitch(){
  const d = realSkulls()[0];
  if(!d) return;
  S.witchUsed=true; d.zone="table";
  say("La Sorcière relance une tête de mort.", C.jade);
  S.phase="roll";
  d.anim={t:0,dur:.55,delay:0,final:ri(6),flick:0};  // ne compte pas comme un lancer
  S.pendingAfterRoll=true; if(!online()||isHost()) SFX.roll();
  broadcastState();
}

/* ------------------------------ SCORE ------------------------------------ */
function comboPts(n){ return n<3?0:(COMBO[Math.min(n,8)]||4000); }
function keyOf(f,c){ return (c.id==="monkey" && (f===PARROT||f===MONKEY)) ? "mp" : f; }
function labelOf(k,n){ return k==="mp" ? n+" singes/perroquets" : n+" "+FN[k]; }

/* Score de la position courante (comme si on encaissait maintenant) */
function turnScore(){
  const c=card();
  const lines=[]; let total=0;

  if(S.island){
    const n=skulls();
    // la Paix doit être tenue même sur l'île : les sabres restants comptent
    const sw=S.dice.filter(d=>(d.zone==="table"||d.zone==="chest") && d.face===SABRE).length;
    const paix=c.id==="peace" && sw>0;
    return {total:0, lines:[{l:"Île de la Tête-de-Mort — "+n+" têtes de mort", p:0}],
            island:n, swords:sw, battleFail:paix, malus:paix?PAIX_MALUS*sw:0};
  }
  const lost = skulls()>=3 && c.id!=="storm";
  let src;
  if(lost) src = (c.id==="chest") ? chestDice() : [];
  else     src = S.dice.filter(d=>d.zone==="table"||d.zone==="chest");

  let faces = src.map(d=>d.face);
  if(c.id==="storm") faces = faces.filter(f=>f===DIAM||f===COIN);

  const groups=new Map();
  faces.forEach(f=>{ const k=keyOf(f,c); groups.set(k,(groups.get(k)||0)+1); });
  const scoringKeys=new Set();
  [...groups.entries()].sort((a,b)=>b[1]-a[1]).forEach(([k,n])=>{
    const p=comboPts(n);
    if(p>0){ total+=p; scoringKeys.add(k); lines.push({l:"Combinaison — "+labelOf(k,n), p}); }
  });
  const nd=faces.filter(f=>f===DIAM).length, nc=faces.filter(f=>f===COIN).length;
  const cv=100;
  if(nd) { total+=nd*100; lines.push({l:nd+" "+(nd>1?"diamants":"diamant")+" × 100", p:nd*100}); }
  if(nc) { total+=nc*cv;  lines.push({l:nc+" "+(nc>1?"pièces d'or":"pièce d'or")+" × "+cv, p:nc*cv}); }

  // Coffre plein : les 8 dés réels marquent
  if(!lost && c.id!=="storm"){
    const reals=S.dice.filter(d=>!d.virtual && (d.zone==="table"||d.zone==="chest"));
    const all = reals.length===8 && reals.every(d=> d.face===DIAM||d.face===COIN||scoringKeys.has(keyOf(d.face,c)));
    if(all){ total+=500; lines.push({l:"Coffre plein", p:500}); }
  }
  if(c.id==="storm"){ total*=2; if(total) lines.push({l:"Naufrage — diamants et pièces doublés", p:0}); }

  // Objectifs liés aux sabres : Bataille (il en faut) et La Paix (il n'en faut aucun)
  const swords = S.dice.filter(d=>(d.zone==="table"||d.zone==="chest") && d.face===SABRE).length;
  let battleFail=false, malus=0;
  if(c.id==="peace"){
    if(swords===0){
      if(!lost){ total*=2; lines.push({l:"La Paix — aucun sabre, points doublés", p:0}); }
    }else{
      battleFail=true; malus=PAIX_MALUS*swords;
      if(S.phase==="resolve"||S.phase==="over"){
        total=-malus;
        lines.length=0; lines.push({l:"La Paix rompue — "+swords+" sabre"+(swords>1?"s":""), p:total});
      }
    }
  }
  if(c.need){
    const won = !lost && swords>=c.need;
    if(won){ total+=c.bonus; lines.push({l:"Bataille remportée ("+swords+" sabres)", p:c.bonus}); }
    else{
      battleFail=true; malus=c.bonus;
      if(S.phase==="resolve"||S.phase==="over"){
        total = BATAILLE_MALUS ? -c.bonus : 0;
        lines.length=0; lines.push({l:"Bataille perdue — "+swords+"/"+c.need+" sabres", p:total});
      }
    }
  }
  if(lost && !c.need && !lines.length) lines.push({l:"3 têtes de mort — tour perdu", p:0});
  if(c.id==="pirate" && total>0){ total*=2; lines.push({l:"Pirate — points doublés", p:0}); }
  return {total, lines, island:0, swords, lost, battleFail, malus};
}

function resolve(){
  S.phase="resolve";
  const p=P(), c=card(), r=turnScore();
  const detail = r.lines.filter(l=>l.l).map(l=>l.l.replace("Combinaison — ","")).join(" · ");
  if(S.island){
    const n=skulls(), mult=(c.id==="pirate")?2:1, pen=n*100*mult;
    S.players.forEach((q,i)=>{ if(i!==S.cur){ q.score-=pen; if(SCORE_MIN_0) q.score=Math.max(0,q.score); } });
    SFX.skull();
    say(p.name+" : île de la Tête-de-Mort, -"+pen+" pour les autres.", C.rust);
    let sub=n+" têtes de mort · -"+pen+" pour chaque adversaire";
    if(c.id==="peace" && r.swords>0){          // la Paix doit être tenue même sur l'île
      const m=PAIX_MALUS*r.swords;
      p.score-=m; if(SCORE_MIN_0) p.score=Math.max(0,p.score);
      sub+=" · La Paix rompue : -"+m;
      say(p.name+" laissait "+r.swords+" sabre"+(r.swords>1?"s":"")+" : -"+m+".", C.rust);
    }
    S.pop.push({txt:L.compact?"ÎLE DES CRÂNES":"ÎLE DE LA TÊTE-DE-MORT", sub, col:C.rust, t:S.t, life:2.1});
  } else if(r.total<=0){
    const trois = skulls()>=3 && c.id!=="storm", paix = c.id==="peace";
    const head = r.battleFail ? (paix?"LA PAIX ROMPUE":"BATAILLE PERDUE")
                              : (trois ? "3 TÊTES DE MORT" : "AUCUN POINT");
    let sub = "Tour perdu";
    if(r.total<0){
      p.score+=r.total; if(SCORE_MIN_0) p.score=Math.max(0,p.score);
      const detail = paix ? r.swords+" sabre"+(r.swords>1?"s":"")+" au dernier lancer"
                          : (trois ? "3 têtes de mort" : r.swords+"/"+c.need+" sabres");
      sub = r.total+" points · "+detail;
    }
    SFX.skull();
    say(p.name+" : "+head.toLowerCase()+(r.total<0?" ("+r.total+" pts, total "+p.score+")":"")+".", C.rust);
    S.pop.push({txt:head, sub, col:C.rust, t:S.t, life:2.0});
  } else {
    p.score+=r.total;
    SFX.bank();
    say(p.name+" encaisse "+r.total+" pts (total "+p.score+").", C.jade);
    if(detail) say(detail, "rgba(234,215,173,.55)");
    S.pop.push({txt:"+"+r.total, sub:detail, col:C.jade, t:S.t, life:1.9});
  }
  if(!S.lastRound && p.score>=TARGET){
    S.lastRound=true; S.endAt=S.cur;
    say(p.name+" dépasse "+TARGET+" ! Dernier tour pour les autres.", C.brass);
  }
  S.flip={mode:"hide",t:0,dur:.55};        // la carte du tour se retourne face cachée
  S.resolveUntil = S.t + (r.total>0?1.55:1.9);
  broadcastState();
}
function gameOver(){
  S.phase="over";
  const best=Math.max(...S.players.map(p=>p.score));
  S.winners=S.players.filter(p=>p.score===best);
  SFX.good();
  broadcastState();
}

/* Présélection : on propose les dés inutiles, sauf quand le risque devient réel */
function preselect(){
  if(skulls()>=2) return;                       // à 2 têtes de mort, au joueur de décider
  const c=card();
  const sw=S.dice.filter(d=>(d.zone==="table"||d.zone==="chest")&&d.face===SABRE).length;
  const re=suggestReroll(!!(c.need && sw<c.need));
  if(re.length>=2) re.forEach(d=>d.sel=true);
}

/* Dés « inutiles » à relancer : sert à l'IA et à la présélection du joueur */
function suggestReroll(force){
  const c=card(), dice=realTable();
  const groups=new Map();
  dice.forEach(d=>{ const k=keyOf(d.face,c); groups.set(k,(groups.get(k)||0)+1); });
  const keep=d=>{
    if(c.id==="storm") return d.face===DIAM||d.face===COIN;
    if(d.face===DIAM||d.face===COIN) return true;
    if(c.need && d.face===SABRE) return true;
    return groups.get(keyOf(d.face,c))>=2;
  };
  const re=dice.filter(d=>!keep(d));
  if(force && re.length<2){
    const poids=d=>(c.need&&d.face===SABRE)?3:((d.face===DIAM||d.face===COIN)?2:0);
    const extra=dice.filter(d=>re.indexOf(d)<0)
      .sort((a,b)=>poids(a)-poids(b)
                 || (groups.get(keyOf(a.face,c))-groups.get(keyOf(b.face,c))));
    while(re.length<2 && extra.length) re.push(extra.shift());
  }
  return re;
}

/* ------------------------------- IA -------------------------------------- */
/* L'IA énumère les façons sensées de relancer, puis simule la fin du tour des
   centaines de fois avec les vraies règles (bataille, coffre, pirate, sorcière,
   coffre plein) et garde le coup dont l'espérance est la meilleure.           */
function binom(n,k){ let r=1; for(let i=0;i<k;i++) r=r*(n-i)/(i+1); return r; }
function pAtLeast(n,k,p=1/6){ if(k<=0) return 1; let s=0; for(let i=k;i<=n;i++) s+=binom(n,i)*Math.pow(p,i)*Math.pow(1-p,n-i); return s; }
const nowMs=()=> (typeof performance!=="undefined"&&performance.now)?performance.now():Date.now();

/* Score final d'une position exprimée en comptes de faces (version rapide). */
function fastScore(tab,chest,bonus,sk,cIdx){
  const c=CARDS[cIdx], coinV=100;
  if(c.id==="peace" && tab[SABRE]+chest[SABRE]>0) return -PAIX_MALUS*(tab[SABRE]+chest[SABRE]);
  if(c.id==="storm"){
    const d=tab[DIAM]+chest[DIAM]+bonus[DIAM], m=tab[COIN]+chest[COIN]+bonus[COIN];
    return (comboPts(d)+comboPts(m)+d*100+m*coinV)*2;
  }
  const lost=sk>=3, g=[0,0,0,0,0,0];
  if(lost){
    if(c.need) return BATAILLE_MALUS?-c.bonus:0;
    if(c.id!=="chest") return 0;
    for(let f=1;f<6;f++) g[f]=chest[f];
  } else for(let f=1;f<6;f++) g[f]=tab[f]+chest[f]+bonus[f];
  const merge=(c.id==="monkey"), sco=[false,false,false,false,false,false];
  let total=0;
  if(merge){ const q=comboPts(g[PARROT]+g[MONKEY]); if(q>0){ total+=q; sco[PARROT]=sco[MONKEY]=true; } }
  for(let f=1;f<6;f++){
    if(merge&&(f===PARROT||f===MONKEY)) continue;
    const q=comboPts(g[f]); if(q>0){ total+=q; sco[f]=true; }
  }
  total+=g[DIAM]*100+g[COIN]*coinV;
  sco[DIAM]=sco[COIN]=true;
  if(!lost){
    let real=0, all=true;
    for(let f=1;f<6;f++){ const n=tab[f]+chest[f]; real+=n; if(n>0&&!sco[f]) all=false; }
    if(real===8&&all) total+=500;
  }
  if(c.need){
    if(tab[SABRE]+chest[SABRE]>=c.need) total+=c.bonus;
    else return BATAILLE_MALUS?-c.bonus:0;
  }
  if(c.id==="peace") total*=2;                 // ici, aucun sabre : la Paix est tenue
  if(c.id==="pirate"&&total>0) total*=2;
  return total;
}
function aiState(){
  const tab=[0,0,0,0,0,0], chest=[0,0,0,0,0,0], bonus=[0,0,0,0,0,0];
  S.dice.forEach(d=>{
    if(d.zone==="chest") chest[d.face]++;
    else if(d.zone==="table") (d.virtual?bonus:tab)[d.face]++;
  });
  return {tab,chest,bonus,sk:skulls(),witch:card().id==="witch"&&!S.witchUsed,cIdx:S.card};
}
const cloneSt=s=>({tab:s.tab.slice(),chest:s.chest.slice(),bonus:s.bonus.slice(),sk:s.sk,witch:s.witch,cIdx:s.cIdx});
function grpSize(st,f){
  const c=CARDS[st.cIdx];
  if(c.id==="monkey"&&(f===PARROT||f===MONKEY))
    return st.tab[PARROT]+st.tab[MONKEY]+st.chest[PARROT]+st.chest[MONKEY];
  return st.tab[f]+st.chest[f];
}
/* Faces qu'il serait absurde de relancer */
function lockedFace(st,f){
  const c=CARDS[st.cIdx];
  if(c.id==="peace"&&f===SABRE) return false; // la Paix : un sabre doit toujours repartir
  if(f===DIAM||f===COIN) return true;        // 100 points déjà acquis
  if(c.need&&f===SABRE)  return true;        // bataille : chaque sabre compte
  return grpSize(st,f)>=3;                   // combinaison déjà faite
}
/* Priorité de sacrifice quand la règle impose de relancer 2 dés */
function sacPri(st,f){
  const c=CARDS[st.cIdx];
  if(!lockedFace(st,f)) return 0;
  if(c.need&&f===SABRE) return 3;
  if(f===DIAM||f===COIN) return 2;
  return 1;
}
/* Plan de relance « raisonnable » utilisé pendant les simulations */
function junkPlan(st){
  const c=CARDS[st.cIdx], k=[0,0,0,0,0,0]; let n=0;
  if(c.id==="peace"&&st.tab[SABRE]){ k[SABRE]=st.tab[SABRE]; n+=st.tab[SABRE]; }
  for(let f=1;f<6;f++){
    if(!st.tab[f]||k[f]||lockedFace(st,f)||grpSize(st,f)>=2) continue;
    k[f]=st.tab[f]; n+=st.tab[f];
  }
  if(n<2){
    const ordre=[];
    for(let f=1;f<6;f++) if(st.tab[f]&&!k[f]) ordre.push(f);
    ordre.sort((a,b)=>sacPri(st,a)-sacPri(st,b)||grpSize(st,a)-grpSize(st,b));
    for(const f of ordre){ if(n>=2) break; k[f]=st.tab[f]; n+=st.tab[f]; }
  }
  return {k,n};
}
/* Déroulé d'une fin de tour jusqu'à l'arrêt, renvoie les points marqués */
function rollout(st){
  const c=CARDS[st.cIdx];
  if(c.id!=="storm") for(let step=0;step<14;step++){
    if(st.sk>=3){
      if(st.witch){ st.witch=false; st.sk--; const f=ri(6); if(f===SKULL) st.sk++; else st.tab[f]++; continue; }
      break;
    }
    const cur=fastScore(st.tab,st.chest,st.bonus,st.sk,st.cIdx);
    const pl=junkPlan(st);
    if(pl.n<2) break;
    const risque=pAtLeast(pl.n,3-st.sk);
    const bataille=c.need&&(st.tab[SABRE]+st.chest[SABRE])<c.need;
    const paix=c.id==="peace"&&(st.tab[SABRE]+st.chest[SABRE])>0;
    if(!(bataille||paix||cur<=0||risque*Math.max(cur,150)<(1-risque)*pl.n*72)) break;
    for(let f=1;f<6;f++) st.tab[f]-=pl.k[f];
    for(let j=0;j<pl.n;j++){ const f=ri(6); if(f===SKULL) st.sk++; else st.tab[f]++; }
  }
  return fastScore(st.tab,st.chest,st.bonus,st.sk,st.cIdx);
}
/* Des points vers une valeur d'usage : fin de partie, course au seuil... */
function aiUtility(pts){
  const me=S.players[S.cur];
  let best=-1e9;
  S.players.forEach((q,i)=>{ if(i!==S.cur&&q.score>best) best=q.score; });
  const fin=me.score+pts;
  if(S.lastRound) return fin>best ? 1000+Math.min(fin-best,800)*.02 : (fin-best)*.02;
  let u=pts;
  if(fin>=TARGET) u+=650;                              // déclencher le dernier tour
  else if(best>=TARGET*.72) u+=Math.max(0,pts)*.22;    // course : viser plus gros
  return u;
}
/* Toutes les relances envisageables : chaque face libre est gardée ou relancée */
function aiCands(st){
  const libres=[];
  for(let f=1;f<6;f++) if(st.tab[f]&&!lockedFace(st,f)) libres.push(f);
  const out=[{k:[0,0,0,0,0,0],n:0}];                   // s'arrêter
  for(let m=1;m<(1<<libres.length);m++){
    const k=[0,0,0,0,0,0]; let n=0;
    libres.forEach((f,i)=>{ if(m&(1<<i)){ k[f]=st.tab[f]; n+=st.tab[f]; } });
    if(n>=2) out.push({k,n});
  }
  if(out.length===1){ const pl=junkPlan(st); if(pl.n>=2) out.push(pl); }
  if(CARDS[st.cIdx].id==="peace" && st.tab[SABRE]>0){     // aucun sabre ne peut rester
    let f2=out.filter(o=>o.n>=2 && o.k[SABRE]===st.tab[SABRE]);
    if(!f2.length){ const pl=junkPlan(st); if(pl.n>=2) f2=[pl]; }
    if(f2.length) return f2;
  }
  return out;
}
function applyPlan(st,o){
  const s2=cloneSt(st);
  if(o.chest) for(let f=1;f<6;f++){ const g=s2.tab[f]-o.cd.k[f]; s2.chest[f]+=g; s2.tab[f]-=g; }
  for(let f=1;f<6;f++) s2.tab[f]-=o.cd.k[f];
  return s2;
}
function aiBest(st){
  const c=CARDS[st.cIdx], t0=nowMs(), liste=[];
  aiCands(st).forEach(cd=>{
    liste.push({cd,chest:false});
    if(c.id==="chest"){
      let garde=0; for(let f=1;f<6;f++) garde+=st.tab[f]-cd.k[f];
      if(garde>0) liste.push({cd,chest:true});
    }
  });
  const evalue=(o,N)=>{
    if(o.cd.n===0){
      const s2=applyPlan(st,o);
      return aiUtility(fastScore(s2.tab,s2.chest,s2.bonus,s2.sk,s2.cIdx));
    }
    let somme=0;
    for(let i=0;i<N;i++){
      const s2=applyPlan(st,o);
      for(let j=0;j<o.cd.n;j++){ const f=ri(6); if(f===SKULL) s2.sk++; else s2.tab[f]++; }
      somme+=aiUtility(rollout(s2));
    }
    return somme/N;
  };
  liste.forEach(o=>{ o.u=evalue(o,40); });
  liste.sort((a,b)=>b.u-a.u);
  const tete=liste.slice(0,5);
  tete.forEach(o=>{ if(nowMs()-t0<70) o.u=o.u*.25+evalue(o,300)*.75; });
  tete.sort((a,b)=>b.u-a.u);
  return tete[0];
}
/* Traduit un plan (comptes par face) en dés réels de la table */
function planDice(k,garder){
  const out=[];
  for(let f=1;f<6;f++){
    const dés=realTable().filter(d=>d.face===f);
    (garder?dés.slice(k[f]):dés.slice(0,k[f])).forEach(d=>out.push(d));
  }
  return out;
}

function aiAct(){
  const c=card(), p=P();
  if(S.phase!=="choose") return;

  // 3 crânes : la Sorcière est le seul recours
  if(skulls()>=3 && c.id==="witch" && !S.witchUsed){ useWitch(); return; }
  if(S.island){ tableDice().forEach(d=>{if(!d.virtual)d.sel=true;}); rollDice(realTable()); return; }

  // Naufrage : un seul lancer restant, seuls diamants et pièces marqueront
  if(c.id==="storm"){
    const re=realTable().filter(d=>d.face!==DIAM&&d.face!==COIN);
    if(re.length>=2){ re.forEach(d=>d.sel=true); rollDice(re); } else resolve();
    return;
  }

  const st=aiState(), best=aiBest(st);
  if(!best){ resolve(); return; }
  if(best.chest){
    const garder=planDice(best.cd.k,true);
    if(garder.length){
      garder.forEach(d=>{ d.zone="chest"; d.sel=false; });
      say(p.name+" met "+garder.length+" dé"+(garder.length>1?"s":"")+" au coffre.", C.parch2);
      S.aiAt=S.t+.6; return;
    }
  }
  if(best.cd.n===0){ resolve(); return; }
  const re=planDice(best.cd.k,false);
  if(re.length<2){ resolve(); return; }
  re.forEach(d=>d.sel=true);
  rollDice(re);
}

/* ------------------------------ LAYOUT ----------------------------------- */
const L={};
function layout(){
  PORTRAIT = H > W*1.02;
  L.compact = Math.min(W,H) < 480;          // téléphone : typo et boutons plus généreux
  L.short   = H < 430;                      // téléphone couché : hauteur très contrainte
  const u = clamp(Math.min(W,H)/(PORTRAIT?21:22), 10, 26);
  S.u=u;
  const pad=Math.round(u*(L.compact?.6:.8));
  const np=S.players.length;
  if(np){
    const rowH=clamp(Math.min(H*(L.short?.046:.036),u*1.3),L.short?12:14,30);
    const barH=rowH*np;
    L.top={x:0,y:0,w:W,h:SAFE.t+clamp(barH+u*(L.short?1.2:2.2),44,H*.30)};
    L.bar={x:pad,y:L.top.h-barH-u*.5,w:W-pad*2,h:barH,row:rowH};
    L.titleY=(SAFE.t+L.bar.y)/2;
  }else{
    L.top={x:0,y:0,w:W,h:SAFE.t+clamp(H*.085,42,72)}; L.bar=null; L.titleY=L.top.h/2;
  }
  L.btnList=buttons();
  const rows=1+Math.max(0,...L.btnList.map(b=>b.row||0));
  const gap=Math.max(6,u*.4);
  const btnH=clamp(H*(PORTRAIT?.084:(L.short?.14:.10)),L.compact?46:40,72);
  const bh=btnH*rows+gap*(rows-1);
  L.btn={x:pad,y:H-bh-pad-SAFE.b,w:W-pad*2,h:bh};

  const bodyY=L.top.h+pad*.6, bodyH=L.btn.y-pad*.6-bodyY;

  if(!PORTRAIT){
    const lw=clamp(W*(L.short?.165:.20),110,255);
    const rw=L.short?0:clamp(W*.21,150,290);        // journal masqué sur écran bas
    L.card={x:pad,y:bodyY,w:lw,h:bodyH};
    L.side={x:W-rw-pad,y:bodyY,w:rw,h:bodyH};
    const mx=lw+pad*2, mr=W-pad-(rw?rw+pad:0);
    L.mid ={x:mx,y:bodyY,w:mr-mx,h:bodyH};
  }else{
    const ch=clamp(bodyH*(L.compact?.26:.30),Math.min(110,bodyH*.20),260);
    const sh=clamp(bodyH*(L.compact?.10:.13),Math.min(L.compact?34:44,bodyH*.07),80);
    L.card={x:pad,y:bodyY,w:W-pad*2,h:ch};
    L.side={x:pad,y:bodyY+ch+pad*.5,w:W-pad*2,h:sh};
    L.mid ={x:pad,y:L.side.y+sh+pad*.5,w:W-pad*2,h:bodyH-ch-sh-pad};
  }
  // zones du plateau
  const m=L.mid, hh=m.h;
  const headH=clamp(hh*.13,Math.min(L.short?26:30,hh*.11),58);
  const useChest=S.phase!=="menu" && S.phase!=="over" && card() && card().id==="chest";
  const coveH=clamp(hh*.19,Math.min(L.short?34:52,hh*.16),110);
  const chestH=useChest?coveH:0;
  L.head ={x:m.x,y:m.y,w:m.w,h:headH};
  L.table={x:m.x,y:m.y+headH+4,w:m.w,h:hh-headH-coveH-chestH-(useChest?16:10)};
  L.cove ={x:m.x,y:L.table.y+L.table.h+6,w:useChest?m.w*.5-4:m.w,h:coveH};
  L.chest={x:m.x+m.w*.5+4,y:L.cove.y,w:m.w*.5-4,h:chestH};
  L.useChest=useChest;
}
function slotPos(rect,i,count,size,rows){
  const cols=Math.ceil(count/rows);
  const gapx=Math.min(size*.22, (rect.w-cols*size)/(cols+1));
  const totw=cols*size+(cols-1)*gapx;
  const r=Math.floor(i/cols), cidx=i%cols;
  const inRow = Math.min(cols, count-r*cols);
  const rw = inRow*size+(inRow-1)*gapx;
  const x=rect.x+(rect.w-rw)/2+cidx*(size+gapx)+size/2;
  const gapy=Math.min(size*.18,(rect.h-rows*size)/(rows+1));
  const toth=rows*size+(rows-1)*gapy;
  const y=rect.y+(rect.h-toth)/2+r*(size+gapy)+size/2;
  return {x,y};
}
function placeDice(){
  const tb=S.dice.filter(d=>d.zone==="table");
  // on essaie 1 ou 2 rangées et on garde celle qui donne les plus gros dés
  let rows=1, size=0;
  for(const r of [1,2]){
    const cols=Math.ceil(tb.length/r);
    const sz=Math.min(L.table.w/(cols+.6), L.table.h/(r+.5));
    if(sz>size){ size=sz; rows=r; }
  }
  size=clamp(size,22,86);
  tb.forEach((d,i)=>{ const p=slotPos(L.table,i,tb.length,size,rows); d.tx=p.x; d.ty=p.y; d.size=size; });

  const sk=skullDice(), ss=clamp(Math.min(L.cove.w/(sk.length+1.2), L.cove.h*.62), 18, size*.8);
  sk.forEach((d,i)=>{ const p=slotPos({x:L.cove.x,y:L.cove.y+L.cove.h*.12,w:L.cove.w,h:L.cove.h*.88},i,sk.length,ss,1); d.tx=p.x; d.ty=p.y; d.size=ss; });

  if(L.useChest){
    const ch=chestDice(), cs=clamp(Math.min(L.chest.w/(ch.length+1.2), L.chest.h*.62), 18, size*.8);
    ch.forEach((d,i)=>{ const p=slotPos({x:L.chest.x,y:L.chest.y+L.chest.h*.12,w:L.chest.w,h:L.chest.h*.88},i,ch.length,cs,1); d.tx=p.x; d.ty=p.y; d.size=cs; });
  } else chestDice().forEach(d=>{ d.zone="table"; });
}

/* ------------------------------ BOUTONS ---------------------------------- */

// « à moi de jouer » pour l'affichage des boutons d'action

function buttons(){

      b.push({id:"bank", l:sc.battleFail
                ?(c.id==="peace"
                    ?(L.compact?"Sabres à éliminer":"Terminez sans sabre (−"+sc.malus+")")
                    :(L.compact?c.need+" sabres requis":"Il faut "+c.need+" sabres (−"+c.bonus+")"))
                :(L.compact?"Encaisser "+sc.total:"Encaisser "+sc.total+" pts"),
              k:"green", on:sc.total>0 && !sc.battleFail});
    b.push({id:"all", l:sel===realTable().length?"Aucun":"Tout", k:"ghost", on:canRoll});
    if(c.id==="chest") b.push({id:"tochest", l:"Au coffre"+(selT?" ("+selT+")":""), k:"ghost", on:selT>=1});
    if(c.id==="witch" && !S.witchUsed && realSkulls().length) b.push({id:"witch",l:"Sorcière",k:"ghost",on:true});
    if(PORTRAIT && b.length>3) b.forEach(x=>{ if(x.k==="ghost") x.row=1; });
    return b;
  }
  return b;
}
function btnRects(list){
  const r=L.btn; if(!list || !list.length) return [];
  const gap=Math.max(6,S.u*.4);
  const rows=1+Math.max(0,...list.map(b=>b.row||0));
  const rh=(r.h-gap*(rows-1))/rows;
  const out=[];
  for(let ro=0;ro<rows;ro++){
    const line=list.filter(b=>(b.row||0)===ro);
    if(!line.length) continue;
    const weights=line.map(x=>x.k==="ghost"?.7:1);
    const tot=weights.reduce((a,b)=>a+b,0);
    const avail=r.w-gap*(line.length-1);
    let x=r.x;
    line.forEach((b,i)=>{ const w=avail*weights[i]/tot;
      out.push({...b,x,y:r.y+ro*(rh+gap),w,h:rh}); x+=w+gap; });
  }
  return out;
}

/* ------------------------------ RENDU ------------------------------------ */
function bg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  if(fondAnime()){                       // la vidéo doit rester visible sous le jeu
    g.addColorStop(0,"rgba(3,12,20,"+Math.min(1,VOILE+.08)+")");
    g.addColorStop(.55,"rgba(9,32,44,"+VOILE+")");
    g.addColorStop(1,"rgba(4,18,28,"+Math.min(1,VOILE+.05)+")");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }else{
    g.addColorStop(0,"#04101a"); g.addColorStop(.55,C.deep); g.addColorStop(1,"#071a22");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // houle discrète (inutile quand la vraie mer s'en charge)
    ctx.save(); ctx.globalAlpha=.05; ctx.strokeStyle=C.jade; ctx.lineWidth=1;
    for(let i=0;i<6;i++){
      const y=H*(.2+i*.13)+Math.sin(S.t*.4+i)*6;
      ctx.beginPath();
      for(let x=0;x<=W;x+=26) ctx.lineTo(x, y+Math.sin(x/120+S.t*.5+i)*4);
      ctx.stroke();
    }
    ctx.restore();
  }
  const v=ctx.createRadialGradient(W/2,H*.45,Math.min(W,H)*.25,W/2,H*.5,Math.max(W,H)*.75);
  v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,.6)");
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
}
function compass(cx,cy,r){ // rose des vents gravée derrière les dés
  ctx.save(); ctx.translate(cx,cy); ctx.globalAlpha=.07; ctx.strokeStyle=C.brass; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,r*.72,0,7); ctx.stroke();
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4, L1=(i%2?r*.55:r*.95), w=(i%2?r*.06:r*.11);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*L1,Math.sin(a)*L1);
    ctx.lineTo(Math.cos(a+Math.PI/2)*w,Math.sin(a+Math.PI/2)*w);
    ctx.lineTo(Math.cos(a-Math.PI/2)*w,Math.sin(a-Math.PI/2)*w);
    ctx.closePath(); ctx.stroke();
  }
  ctx.restore();
}

function drawProgress(){
  const r=L.bar, n=S.players.length, row=r.row;
  const cap=clamp(S.u*.6,8,12);
  text(L.compact?"OBJECTIF "+TARGET:"OBJECTIF "+TARGET+" POINTS", r.x+r.w, L.titleY, cap,
       {col:"rgba(234,215,173,.45)",al:"right",w:"700",ls:1.2});
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.4)"; rr(r.x,r.y,r.w,r.h,5); ctx.fill();
  rr(r.x,r.y,r.w,r.h,5); ctx.clip();
  // graduations tous les 1000 points
  ctx.strokeStyle="rgba(234,215,173,.14)"; ctx.lineWidth=1;
  for(let v=1000;v<TARGET;v+=1000){
    const gx=Math.round(r.x+r.w*v/TARGET)+.5;
    ctx.beginPath(); ctx.moveTo(gx,r.y); ctx.lineTo(gx,r.y+r.h); ctx.stroke();
  }
  S.players.forEach((p,i)=>{
    const y=r.y+i*row, col=(p.ai?BAR_AI[Math.max(0,i-1)%BAR_AI.length]:BAR_ME)||BAR_ME;
    const w=r.w*clamp(p.disp/TARGET,0,1);      // un score négatif laisse la bande vide
    const g=ctx.createLinearGradient(0,y,0,y+row);
    g.addColorStop(0,col.hi); g.addColorStop(1,col.lo);
    ctx.fillStyle=g; ctx.fillRect(r.x,y+1,w,row-2);
    if(p.score>=TARGET){ ctx.fillStyle="rgba(217,164,65,.85)"; ctx.fillRect(r.x+r.w-3,y+1,3,row-2); }
    // séparateurs + surlignage du joueur actif
    ctx.strokeStyle="rgba(0,0,0,.5)"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(r.x,y+row-.5); ctx.lineTo(r.x+r.w,y+row-.5); ctx.stroke();
    const act=i===S.cur && S.phase!=="over";
    if(act){ ctx.strokeStyle="rgba(255,240,200,.85)"; ctx.lineWidth=1.6;
      ctx.strokeRect(r.x+.8,y+1,r.w-1.6,row-2); }
    const fs=clamp(row*.6,8,14);
    text(p.name, r.x+6, y+row/2, fs, {col:act?"#fff":"rgba(255,255,255,.82)",w:"700",sh:1});
    text(String(Math.round(p.disp)), r.x+r.w-6, y+row/2, fs,
         {col:act?"#fff":"rgba(255,255,255,.82)",al:"right",w:"700",sh:1});
  });
  ctx.restore();
  ctx.save(); ctx.strokeStyle="rgba(217,164,65,.35)"; ctx.lineWidth=1.4; rr(r.x,r.y,r.w,r.h,5); ctx.stroke(); ctx.restore();
}

function drawCardAnim(x,y,w,h){
  const f=S.flip, r=Math.max(6,w*.06);
  const p=f.mode==="reveal"||f.mode==="hide" ? clamp(f.t/f.dur,0,1) : 1;
  const spin = f.mode==="reveal"||f.mode==="hide";
  const back = f.mode==="back" ? true
             : f.mode==="reveal" ? p<.5
             : f.mode==="hide"   ? p>=.5 : false;
  const k = spin ? Math.max(.02, Math.abs(Math.cos(p*Math.PI))) : 1;
  ctx.save();
  ctx.translate(x+w/2,y); ctx.scale(k,1); ctx.translate(-w/2,0);
  if(spin){ ctx.shadowColor="rgba(0,0,0,.5)"; ctx.shadowBlur=18*(1-k); }
  if(back) drawBack(0,0,w,h,r); else drawCard(S.card,0,0,w,h,r);
  // tranche éclairée quand la carte est de profil
  if(spin && k<.35){ ctx.fillStyle="rgba(255,235,190,"+(.5*(1-k/.35))+")"; rr(0,0,w,h,r); ctx.fill(); }
  ctx.restore();
  if(f.mode==="reveal" && p>.85){
    ctx.save(); ctx.globalAlpha=(p-.85)/.15*.5;
    ctx.strokeStyle=C.brass; ctx.lineWidth=3; rr(x-4,y-4,w+8,h+8,10); ctx.stroke(); ctx.restore();
  }
}
/* Opacité du nom et du texte de la carte : ils suivent la face visible */
function cardTextAlpha(){
  const f=S.flip;
  if(f.mode==="back") return 0;
  if(f.mode==="hide")   return clamp(1-f.t/(f.dur*.5),0,1);
  if(f.mode==="reveal") return clamp((f.t/f.dur-.5)/.35,0,1);
  return 1;
}

  const cx=W/2;

  text("MULTIJOUEUR", cx, H*.24, t, {col:C.brass,al:"center",font:DISPLAY,w:"700",ls:t*.08,sh:2});
  text("Partie rapide — 2 à 4 pirates en ligne", cx, H*.31, clamp(t*.32,11,17),
       {col:"rgba(234,215,173,.75)",al:"center",w:"500"});
  text("Entrez votre nom, puis lancez la recherche.", cx, H*.365, clamp(t*.3,10,15),
       {col:"rgba(234,215,173,.55)",al:"center",w:"500"});
  positionNick();
  text("Une partie disponible vous accueille ; sinon vous en ouvrez une.", cx, H*.56,
       clamp(t*.28,10,14), {col:"rgba(234,215,173,.45)",al:"center",w:"500"});
}
function seatColor(i){ return i===0?BAR_ME:(BAR_AI[(i-1)%BAR_AI.length]); }
function drawLobby(){
  const cx=W/2;
  const t=clamp(Math.min(W/13,H/12),16,40);
  text("SALON", cx, H*.15, t, {col:C.brass,al:"center",font:DISPLAY,w:"700",ls:t*.1});
  const ros = isHost() ? S.players.map(p=>({name:p.name,seat:p.seat,ai:p.ai})) : (S.lobby||[]);
  text(NET.status||"", cx, H*.22, clamp(t*.34,10,16), {col:"rgba(234,215,173,.7)",al:"center",w:"600"});
  const n=Math.max(ros.length,1);
  const cw=clamp(W*.6,220,460), rh=clamp(H*.08,42,64), x=cx-cw/2;
  let y=H*.3;
  for(let i=0;i<MAX_PLAYERS;i++){
    const p=ros[i];
    ctx.save();
    ctx.fillStyle=p?"rgba(255,255,255,.06)":"rgba(255,255,255,.02)";
    rr(x,y,cw,rh,10); ctx.fill();
    if(p){ const c=seatColor(p.seat); ctx.fillStyle=c.hi; rr(x,y,6,rh,3); ctx.fill(); }
    ctx.strokeStyle="rgba(217,164,65,.2)"; ctx.lineWidth=1.2; rr(x,y,cw,rh,10); ctx.stroke();
    ctx.restore();
    const fs=clamp(rh*.4,12,20);
    if(p){
      const moi = online() && p.seat===NET.seat;
      text(p.name+(moi?" (vous)":"")+(p.ai?" — IA":""), x+18, y+rh/2, fs,
           {col:moi?"#fff":C.parch, w:"700"});
      if(p.seat===0) text("HÔTE", x+cw-16, y+rh/2, clamp(fs*.7,9,13), {col:C.brass,al:"right",w:"700",ls:1});
    }else{
      text("En attente…", x+18, y+rh/2, fs, {col:"rgba(234,215,173,.35)", w:"500"});
    }
    y+=rh+8;
  }
  const info = isHost()
     ? (ros.length>=2 ? "Vous pouvez démarrer quand vous voulez." : "En attente d'au moins un autre joueur…")
     : "En attente que l'hôte lance la partie…";
  text(info, cx, y+rh*.3, clamp(t*.3,10,15), {col:"rgba(234,215,173,.6)",al:"center",w:"500"});
}
function drawRules(){
  const w=clamp(W*.86,260,760), x=(W-w)/2, y=L.top.h+S.u*1.2, h=L.btn.y-y-S.u;
  paraph(x,y,w,h,14);
  const fs=clamp(S.u*.72,9,14);
  const R=[
    ["Le tour","Retournez une carte Pirate, lancez les 8 dés, mettez les têtes de mort de côté."],
    ["Relancer","Relancez au moins 2 dés autant de fois que vous voulez, jamais les têtes de mort."],
    ["3 têtes de mort","Le tour est perdu : 0 point (sauf les dés déjà au coffre)."],
    ["Combinaisons","3 identiques 100 · 4 : 200 · 5 : 500 · 6 : 1000 · 7 : 2000 · 8 : 4000."],
    ["Symboles","Chaque diamant et chaque pièce d'or valent 100 points de plus."],
    ["Coffre plein","Si les 8 dés marquent, bonus de 500 points."],
    ["Île de la Tête-de-Mort","4 têtes de mort ou plus au 1er lancer : vous ne marquez rien, mais chaque nouvelle tête de mort coûte 100 points à chaque adversaire."],
    ["Bataille","Réunir les sabres demandés rapporte le bonus de la carte ; échouer fait perdre le même nombre de points."],
    ["Fin","Au-delà de "+TARGET+" points, les autres joueurs jouent un dernier tour. Le meilleur score l'emporte."]
  ];
  let ty=y+S.u*1.8;
  text("RÈGLES", x+w/2, ty, clamp(S.u*1.05,12,20), {col:"#6b3f0c",al:"center",font:DISPLAY,w:"700",ls:2});
  ty+=S.u*2;
  for(const [k,v] of R){
    text(k, x+S.u*1.3, ty, fs, {col:"#7a4a10",w:"700"});
    ty+=fs*1.35;
    wrap(v,fs,w-S.u*2.6).forEach(ln=>{ text(ln,x+S.u*1.3,ty,fs,{col:"rgba(40,26,8,.8)",w:"500"}); ty+=fs*1.25; });
    ty+=fs*.5;
    if(ty>y+h-fs*2) break;
  }
}
function drawOver(){
  ctx.save(); ctx.fillStyle="rgba(3,8,13,.8)"; ctx.fillRect(0,0,W,H); ctx.restore();
  const names=S.winners.map(p=>p.name).join(" & ");
  const t=clamp(Math.min(W/13,H/11),18,54);
  text(S.winners.length>1?"ÉGALITÉ":"VICTOIRE", W/2, H*.28, t*.55, {col:C.parch2,al:"center",w:"700",ls:3});
  text(names.toUpperCase(), W/2, H*.38, t, {col:C.brass,al:"center",font:DISPLAY,w:"700",ls:t*.06});
  let y=H*.5;
  [...S.players].sort((a,b)=>b.score-a.score).forEach(p=>{
    const fs=clamp(S.u*1.05,12,20);
    text(p.name, W/2-clamp(W*.16,80,180), y, fs, {col:C.parch,w:"600"});
    text(String(p.score), W/2+clamp(W*.16,80,180), y, fs, {col:C.bone,al:"right",w:"700",font:DISPLAY});
    y+=fs*1.7;
  });
}
function drawBanner(){
  if(!S.banner || S.t>S.banner.t){ S.banner=null; return; }
  const a=clamp((S.banner.t-S.t)/.5,0,1);
  const fs=clamp(S.u*.95,11,19);
  ctx.save(); ctx.globalAlpha=a;
  ctx.font="700 "+fs+"px "+UI;
  const w=ctx.measureText(S.banner.txt).width+fs*2;
  const x=W/2-w/2, y=L.head?L.head.y+L.head.h*.1:H*.2;
  ctx.fillStyle="rgba(6,20,30,.9)"; rr(x,y,w,fs*2,9); ctx.fill();
  ctx.strokeStyle=S.banner.col; ctx.lineWidth=1.5; ctx.stroke();
  text(S.banner.txt,W/2,y+fs,fs,{col:S.banner.col,al:"center",w:"700"});
  ctx.restore();
}
function drawPops(){
  S.pop=S.pop.filter(p=>S.t-p.t<p.life);
  if(!S.pop.length || !L.table) return;
  const cx=L.table.x+L.table.w/2, cy=L.table.y+L.table.h*.52;
  S.pop.forEach(p=>{
    const k=(S.t-p.t)/p.life;
    const rise=(1-Math.pow(1-k,3))*L.table.h*.16;
    const a = k<.1 ? k/.1 : (k>.72 ? (1-k)/.28 : 1);
    const sc= k<.16 ? .82+.18*(1-Math.pow(1-k/.16,2)) : 1;
    const fs=clamp(Math.min(S.u*2.1, L.table.w/(p.txt.length*.62)),16,46)*sc;
    ctx.save(); ctx.globalAlpha=clamp(a,0,1);
    ctx.fillStyle="rgba(4,14,22,.55)";
    const bw=Math.min(L.table.w*.92, fs*p.txt.length*.66+fs);
    rr(cx-bw/2, cy-rise-fs*.95, bw, fs*(p.sub?2.2:1.7), 12); ctx.fill();
    text(p.txt, cx, cy-rise, fs, {col:p.col,al:"center",font:DISPLAY,w:"700",sh:2});
    if(p.sub){
      const ss=clamp(fs*.3,9,15);
      wrap(p.sub, ss, bw-fs*.6).slice(0,2).forEach((ln,i)=>
        text(ln, cx, cy-rise+fs*.72+i*ss*1.2, ss, {col:"rgba(234,215,173,.8)",al:"center",w:"600"}));
    }
    ctx.restore();
  });
}

/* ------------------------------ BOUCLE ----------------------------------- */
let last=now();
function update(dt){
  S.t=now();
  // retournement de la carte
  if(S.flip.mode==="reveal"||S.flip.mode==="hide"){
    S.flip.t+=dt;
    if(S.flip.t>=S.flip.dur){
      if(S.flip.mode==="hide"){ S.flip.mode="back"; SFX.card(); }
      else S.flip.mode=null;
    }
  }
  // le score affiché rattrape le score réel : la barre monte ou descend en direct
  S.players.forEach(p=>{
    if(p.disp===undefined) p.disp=p.score;
    const d=p.score-p.disp;
    if(Math.abs(d)<1) p.disp=p.score;
    else p.disp+=Math.sign(d)*Math.min(Math.abs(d), Math.max(900, Math.abs(d)*3.2)*dt);
  });
  const pilote = !online() || isHost();     // qui fait avancer la partie
  if(pilote && S.phase==="card" && S.flip.mode===null){
    if(P().ai && !S.aiAt) S.aiAt=S.t+.45;
    if(P().ai && S.t>S.aiAt){ S.aiAt=0; rollDice(realTable()); }
  }
  // fin de tour : on laisse le temps de lire, puis la carte suivante se retourne
  if(pilote && S.phase==="resolve" && S.t>S.resolveUntil) nextTurn();
  // animations de dés
  let rolling=false;
  S.dice.forEach(d=>{
    if(d.anim){
      const a=d.anim; a.t+=dt;
      if(a.t<a.delay){ rolling=true; return; }
      const k=(a.t-a.delay)/a.dur;
      if(k<1){
        rolling=true;
        a.flick+=dt;
        if(a.flick>.055){ a.flick=0; d.face=ri(6); }
        d.rot=Math.sin(k*22)*(1-k)*.5;
        d.sc=1+Math.sin(k*Math.PI)*.16;
      }else{
        d.face=a.final; d.anim=null; d.rot=0; d.sc=1;
      }
    }
    d.x=lerp(d.x,d.tx,1-Math.pow(.001,dt));
    d.y=lerp(d.y,d.ty,1-Math.pow(.001,dt));
  });
  if(S.pendingAfterRoll && !rolling){ S.pendingAfterRoll=false; afterRoll(); }
  // IA
  const pl=S.players[S.cur];
  if(pilote && pl && pl.ai && S.phase==="choose"){
    if(!S.aiAt) S.aiAt=S.t+.8;                       // jamais de tour d'IA figé
    else if(S.t>S.aiAt){ S.aiAt=0; aiAct(); }
  }
}
function render(){
  ctx.clearRect(0,0,W,H);
  bg();
  if(S.phase==="menu"){ drawTop(); drawMenu(); }
  else if(S.phase==="nick"){ drawTop(); drawNick(); }
  else if(S.phase==="lobby"){ drawTop(); drawLobby(); }
  else if(S.phase==="rules"){ drawTop(); drawRules(); }
  else{
    drawCardPanel();
    drawHead();
    drawZones();
    placeDice();
    if(S.rolls===0 && S.phase==="card"){
      text("8 dés prêts à être lancés", L.table.x+L.table.w/2, L.table.y+L.table.h/2,
           clamp(S.u*.9,10,17), {col:"rgba(234,215,173,.45)",al:"center",w:"600"});
    }else{
      S.dice.filter(d=>d.zone!=="table").forEach(drawDie);
      S.dice.filter(d=>d.zone==="table").forEach(drawDie);
    }
    drawSide();
    drawBanner();
    drawPops();
    if(S.phase==="over") drawOver();
    drawTop();                     // la barre de progression reste lisible par-dessus les voiles
  }
  btnRects(L.btnList).forEach(drawBtn);
}
function loop(){
  const t=now(); const dt=Math.min(.05,t-last); last=t;
  layout(); update(dt); render();
  requestAnimationFrame(loop);
}

/* ------------------------------ ENTRÉES ---------------------------------- */
const nickEl=document.getElementById("nick");
function showNick(){
  if(!nickEl) return;
  nickEl.style.display="block";
  if(!nickEl.value) nickEl.value = NET.name || ("Corsaire"+(1+ri(99)));
  positionNick(); setTimeout(()=>{ nickEl.focus(); nickEl.select(); },30);
}
function hideNick(){ if(nickEl){ nickEl.blur(); nickEl.style.display="none"; } }
function positionNick(){
  if(!nickEl || nickEl.style.display==="none") return;
  const w=Math.min(W*0.7,360), h=clamp(H*0.07,42,60);
  nickEl.style.left=(W/2-w/2)+"px";
  nickEl.style.top =(H*0.42)+"px";
  nickEl.style.width=w+"px"; nickEl.style.height=h+"px";
  nickEl.style.fontSize=clamp(h*0.4,14,22)+"px";
}
if(nickEl) nickEl.addEventListener("keydown",e=>{
  if(e.key==="Enter"){ const n=nickEl.value.trim(); hideNick(); quickPlay(n); }
});
const SAFE={t:0,b:0};
function resize(){
  const st=document.getElementById("sat"), sb=document.getElementById("sab");
  SAFE.t = st?st.offsetHeight:0; SAFE.b = sb?sb.offsetHeight:0;
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
window.addEventListener("resize",()=>{ resize(); positionNick(); });
window.addEventListener("orientationchange",()=>setTimeout(()=>{resize();positionNick();},120));

function at(e){
  const r=cv.getBoundingClientRect();
  const p=(e.touches&&e.touches[0])||e;
  return {x:p.clientX-r.left, y:p.clientY-r.top};
}
function hit(b,p){ return p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h; }

function press(p){
  const bs=btnRects(L.btnList);
  for(const b of bs){ if(hit(b,p)){ if(b.on){ SFX.click(); action(b.id); } return; } }
  if(S.phase==="choose" && myControls() && !S.island){
    for(let i=0;i<S.dice.length;i++){
      const d=S.dice[i];
      if(d.virtual || (d.zone!=="table" && !(d.zone==="chest" && card().id==="chest"))) continue;
      const s=d.size;
      if(p.x>d.x-s/2-4&&p.x<d.x+s/2+4&&p.y>d.y-s/2-4&&p.y<d.y+s/2+4){
        SFX.click();
        if(online()) sendIntent({a:"sel", k:i}); else d.sel=!d.sel;
        return;
      }
    }
  }
  if(S.phase==="resolve"){
    if(online()){ if(myTurn()) sendIntent({a:"skip"}); }
    else S.resolveUntil=Math.min(S.resolveUntil, S.t+.15);
  }
}
function action(id){
  // en ligne, les actions de jeu passent par le réseau (l'hôte tranche)
  if(online()){
    switch(id){
      case "first": sendIntent({a:"first"}); return;
      case "roll":  sendIntent({a:"roll"});  return;
      case "bank":  sendIntent({a:"bank"});  return;
      case "all":   sendIntent({a:"all"});   return;
      case "tochest": sendIntent({a:"chest"}); return;
      case "witch": sendIntent({a:"witch"}); return;
      case "leave": leaveOnline(); return;
    }
  }
  switch(id){
    case "play": newGame(S.nAI); break;
    case "ai1": S.nAI=1; break;
    case "ai2": S.nAI=2; break;
    case "ai3": S.nAI=3; break;
    case "video": basculeVideo(); break;
    case "online": S.phase="nick"; showNick(); break;
    case "go": { const n=(document.getElementById("nick").value||"").trim(); hideNick(); quickPlay(n); break; }
    case "cancel": hideNick(); leaveOnline(); break;
    case "start": sendIntent({a:"start"}); break;
    case "leave": leaveOnline(); break;
    case "rules": S.prev=S.phase; S.phase="rules"; break;
    case "back": S.phase=S.prev||"menu"; break;
    case "menu": S.phase="menu"; S.players=[]; S.dice=[]; break;
    case "first": rollDice(realTable()); break;
    case "roll":
      if(S.island){ tableDice().forEach(d=>{if(!d.virtual)d.sel=true;}); rollDice(realTable()); }
      else{
        const sel=rerollable().filter(d=>d.sel);
        const sortis=sel.filter(d=>d.zone==="chest");
        if(sortis.length){
          sortis.forEach(d=>d.zone="table");
          say("Vous ressortez "+sortis.length+" dé"+(sortis.length>1?"s":"")+" du coffre.", C.parch2);
        }
        rollDice(sel);
      }
      break;
    case "bank": resolve(); break;
    case "all": {
      const rt=realTable(), all=rt.every(d=>d.sel);
      rt.forEach(d=>d.sel=!all); break;
    }
    case "tochest": {
      const sel=S.dice.filter(d=>d.zone==="table"&&!d.virtual&&d.sel);
      sel.forEach(d=>{ d.zone="chest"; d.sel=false; });
      say("Vous mettez "+sel.length+" dé"+(sel.length>1?"s":"")+" au coffre.", C.brass);
      if(stuck()) resolve();
      break;
    }
    case "witch": useWitch(); break;

  }
}
cv.addEventListener("pointerdown",e=>{ e.preventDefault(); press(at(e)); });
cv.addEventListener("pointerup",()=>{ S.hover=null; });
cv.addEventListener("pointercancel",()=>{ S.hover=null; });
cv.addEventListener("pointermove",e=>{
  const p=at(e); S.hover=null;
  for(const b of btnRects(L.btnList)) if(hit(b,p)&&b.on){ S.hover=b.id; break; }
  if(!S.hover && S.phase==="choose" && isHuman()){
    S.dice.forEach((d,i)=>{ if((d.zone==="table"||d.zone==="chest")&&!d.virtual){
      const s=d.size;
      if(p.x>d.x-s/2&&p.x<d.x+s/2&&p.y>d.y-s/2&&p.y<d.y+s/2) S.hover="die"+i;
    }});
  }
});
window.addEventListener("keydown",e=>{
  if(e.key===" "||e.key==="Enter"){
    e.preventDefault();
    const bs=(L.btnList||[]).filter(b=>b.on);
    const b=bs.find(x=>x.k==="gold")||bs[0];
    if(b){ SFX.click(); action(b.id); }
  }
  if(e.key==="m"||e.key==="M") muted=!muted;
  if(e.key==="v"||e.key==="V") basculeVideo();
});

/* ------------------------------ DÉMARRAGE -------------------------------- */
resize();
initVideo();
loadAll(()=>{
  document.getElementById("boot").style.display="none";
  buildDeck();
  requestAnimationFrame(loop);
});
</script>
